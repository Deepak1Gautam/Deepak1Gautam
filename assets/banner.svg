      values="-60;540"
      dur="6.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1100" cy="-100" r="3">
    <animate attributeName="cy"
      values="-100;540"
      dur="8.5s"
      repeatCount="indefinite"/>
  </circle>

</g>


