<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
    <stop stop-color="#03040B"/>
    <stop offset="0.45" stop-color="#080B1C"/>
    <stop offset="1" stop-color="#160720"/>
  </linearGradient>

  <!-- Animated Title -->
  <linearGradient id="titleGradient" x1="100" y1="0" x2="760" y2="0">
    <stop stop-color="#A855F7">
      <animate attributeName="stop-color"
        values="#A855F7;#EC4899;#22D3EE;#A855F7"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>

    <stop offset="0.5" stop-color="#EC4899">
      <animate attributeName="stop-color"
        values="#EC4899;#22D3EE;#A855F7;#EC4899"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>

    <stop offset="1" stop-color="#22D3EE">
      <animate attributeName="stop-color"
        values="#22D3EE;#A855F7;#EC4899;#22D3EE"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="20"/>
  </filter>

  <!-- Orbs -->
  <radialGradient id="purpleOrb">
    <stop stop-color="#A855F7" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="cyanOrb">
    <stop stop-color="#22D3EE" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40"
      stroke="#8B5CF6"
      stroke-opacity="0.08"/>
  </pattern>

  <style>
    .sans {
      font-family: Arial, Helvetica, sans-serif;
    }

    .mono {
      font-family: "Courier New", monospace;
    }
  </style>

</defs>


<!-- ================= BACKGROUND ================= -->

<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<rect width="1200" height="520" rx="28" fill="url(#grid)"/>


<!-- ================= MOVING ORBS ================= -->

<circle cx="150" cy="150" r="220"
  fill="url(#purpleOrb)"
  filter="url(#softGlow)">

  <animate attributeName="cx"
    values="150;280;150"
    dur="12s"
    repeatCount="indefinite"/>

  <animate attributeName="cy"
    values="150;250;150"
    dur="10s"
    repeatCount="indefinite"/>

</circle>


<circle cx="1050" cy="350" r="220"
  fill="url(#cyanOrb)"
  filter="url(#softGlow)">

  <animate attributeName="cx"
    values="1050;920;1050"
    dur="14s"
    repeatCount="indefinite"/>

</circle>


<!-- ================= FALLING STARS ================= -->

<g fill="#FFFFFF" filter="url(#glow)">

  <circle cx="80" cy="-20" r="3">
    <animate attributeName="cy"
      values="-20;540"
      dur="7s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="180" cy="-80" r="2">
    <animate attributeName="cy"
      values="-80;540"
      dur="9s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="310" cy="-30" r="2.5">
    <animate attributeName="cy"
      values="-30;540"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="460" cy="-100" r="2">
    <animate attributeName="cy"
      values="-100;540"
      dur="8s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="650" cy="-40" r="3">
    <animate attributeName="cy"
      values="-40;540"
      dur="7.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="780" cy="-120" r="2">
    <animate attributeName="cy"
      values="-120;540"
      dur="10s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="940" cy="-60" r="2.5">
